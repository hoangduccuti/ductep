<!-- ==================== ĐĂNG NHẬP ==================== -->

<main class="dang-nhap-trang">


    <div class="dang-nhap-khung">


        <div class="dang-nhap-icon">

            <i class="fa-solid fa-user-shield"></i>

        </div>


        <p class="nho">
            DUCTEP ADMIN
        </p>


        <h1>
            ĐĂNG NHẬP
        </h1>


        <p class="dang-nhap-mo-ta">
            ĐĂNG NHẬP ĐỂ QUẢN LÝ
            YÊU CẦU KHÁCH HÀNG.
        </p>


        <form
            action="/dang-nhap"
            method="POST"
        >


            <div class="o-nhap">

                <i class="fa-solid fa-user"></i>

                <input
                    type="text"
                    name="tenDangNhap"
                    placeholder="TÊN ĐĂNG NHẬP"
                    required
                >

            </div>



            <div class="o-nhap">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    name="matKhau"
                    placeholder="MẬT KHẨU"
                    required
                >

            </div>


            <button type="submit">
                ĐĂNG NHẬP
            </button>


        </form>


        <a
            class="quay-lai"
            href="index.html"
        >
            ← QUAY VỀ TRANG CHỦ
        </a>


    </div>


</main>
